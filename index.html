<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Laurka dla Cesarzowej Malgorzaty z okazji swieta Partnera Karmicznego Antoniego."
    />
    <title>Dla Cesarzowej Malgorzaty</title>

    <style>
      :root {
        color-scheme: dark;
        background: #080311;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        padding: clamp(8px, 2vw, 24px);
        overflow-x: hidden;
        background:
          radial-gradient(circle at 50% 12%, rgba(255, 211, 0, 0.16), transparent 30%),
          linear-gradient(180deg, #090313 0%, #130720 55%, #080311 100%);
      }

      .laurka {
        display: block;
        width: min(100%, 1274px);
        height: auto;
        border-radius: 4px;
        box-shadow:
          0 0 24px rgba(255, 210, 0, 0.18),
          0 30px 80px rgba(0, 0, 0, 0.65);
      }
    </style>
  </head>

  <body>
    <main>
      <img
        class="laurka"
        src="laurka_bugatti_cesarzowa_v4.png"
        alt="Uroczysta laurka dla Cesarzowej Malgorzaty z Bugatti, kwiatami i zlotymi reflektorami"
        width="3000"
        height="4600"
      />
    </main>
  </body>
</html>
